<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BudgetLens - Personal Expense Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg-primary: #0a0f1a;
            --bg-secondary: #111827;
            --bg-card: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent: #10b981;
            --accent-hover: #059669;
            --danger: #ef4444;
            --warning: #f59e0b;
            --border: rgba(255, 255, 255, 0.08);
            --radius: 14px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .app-container {
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .app-header {
            text-align: center;
            padding: 20px 16px 8px;
        }
        .app-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #10b981, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .app-subtitle { font-size: 0.78rem; color: var(--text-secondary); }

        /* Main */
        .app-main { flex: 1; padding: 16px; padding-bottom: 80px; }

        /* Navbar */
        .navbar {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 600px;
            display: flex; background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            backdrop-filter: blur(20px); z-index: 100;
        }
        .nav-tab {
            flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
            padding: 10px 0; background: none; border: none;
            color: var(--text-secondary); font-size: 0.68rem; cursor: pointer; transition: color 0.2s;
        }
        .nav-tab.active { color: var(--accent); }
        .nav-tab:hover { color: var(--text-primary); }
        .nav-icon { font-size: 1.2rem; }

        /* Page headers */
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .dashboard-page h2, .expenses-page h2, .categories-page h2, .expense-form-page h2 { margin-bottom: 4px; }
        .dash-subtitle { color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 16px; }

        /* Stat cards */
        .stat-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-card {
            background: var(--bg-card); border-radius: var(--radius); padding: 14px;
            display: flex; align-items: center; gap: 12px;
        }
        .stat-icon {
            width: 40px; height: 40px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
        }
        .stat-value { font-size: 1.1rem; font-weight: 700; }
        .stat-label { font-size: 0.72rem; color: var(--text-secondary); }

        /* Buttons */
        .btn {
            padding: 10px 20px; border: none; border-radius: 10px;
            font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
            font-family: inherit;
        }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
        .btn-secondary { background: var(--bg-card); color: var(--text-primary); }
        .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
        .btn-danger:hover { background: var(--danger); color: white; }
        .btn-large { padding: 14px 32px; font-size: 0.95rem; border-radius: 12px; }
        .btn-small { padding: 6px 14px; font-size: 0.78rem; }
        .btn-icon {
            background: none; border: none; color: var(--text-secondary);
            font-size: 1rem; cursor: pointer; padding: 4px 6px; border-radius: 4px;
        }
        .btn-icon:hover { color: var(--text-primary); }
        .btn-delete:hover { color: var(--danger); }

        /* FAB */
        .fab {
            position: fixed; bottom: 80px; right: calc(50% - 280px);
            width: 52px; height: 52px; border-radius: 50%;
            background: var(--accent); color: white; border: none;
            font-size: 1.5rem; cursor: pointer; box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
            transition: transform 0.2s; z-index: 50;
        }
        .fab:hover { transform: scale(1.1); }

        /* Forms */
        .form-field { margin-bottom: 16px; }
        .form-label { display: block; font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 6px; }
        .form-row { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
        .form-actions { display: flex; gap: 10px; margin-top: 20px; }

        .text-input, .amount-input {
            width: 100%; padding: 10px 14px;
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
            color: var(--text-primary); font-size: 0.9rem; outline: none; font-family: inherit;
        }
        .text-input:focus, .amount-input:focus { border-color: var(--accent); }

        .amount-input-wrap {
            display: flex; align-items: center; gap: 8px;
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
            padding: 0 14px;
        }
        .amount-input-wrap:focus-within { border-color: var(--accent); }
        .currency-symbol { color: var(--accent); font-size: 1.1rem; font-weight: 600; }
        .amount-input-wrap .amount-input {
            border: none; padding: 12px 0; font-size: 1.3rem; font-weight: 600; background: none;
        }

        .color-input { width: 44px; height: 40px; border: none; border-radius: 10px; cursor: pointer; background: none; }
        .budget-input { max-width: 160px; }

        /* Quick amounts */
        .quick-amounts { display: flex; gap: 6px; margin-top: 8px; }
        .quick-amt-btn {
            padding: 6px 12px; background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 8px; color: var(--text-secondary); font-size: 0.78rem; cursor: pointer;
            font-family: inherit;
        }
        .quick-amt-btn:hover { border-color: var(--accent); color: var(--accent); }

        /* Category chips */
        .category-grid { display: flex; flex-wrap: wrap; gap: 8px; }
        .cat-chip {
            display: flex; align-items: center; gap: 6px;
            padding: 8px 14px; border-radius: 20px;
            background: var(--bg-card); border: 1px solid var(--border);
            cursor: pointer; transition: all 0.2s; font-size: 0.82rem;
        }
        .cat-chip:hover { border-color: var(--accent); }
        .cat-chip.selected { border-color: transparent; }
        .cat-chip-icon { font-size: 1rem; }

        /* Expense list */
        .expense-row {
            display: flex; align-items: center; gap: 12px;
            padding: 12px; background: var(--bg-card); border-radius: var(--radius);
            margin-bottom: 8px;
        }
        .expense-icon {
            width: 40px; height: 40px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center; font-size: 1.1rem;
            flex-shrink: 0;
        }
        .expense-details { flex: 1; min-width: 0; }
        .expense-desc { font-weight: 500; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .expense-meta { color: var(--text-secondary); font-size: 0.75rem; margin-top: 2px; }
        .expense-amount { font-weight: 700; font-size: 0.95rem; color: var(--danger); white-space: nowrap; }
        .expense-actions { display: flex; gap: 2px; }

        /* Filter bar */
        .filter-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .search-wrap {
            display: flex; align-items: center; gap: 6px; flex: 1; min-width: 160px;
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
            padding: 0 10px;
        }
        .search-icon { font-size: 0.85rem; }
        .search-input {
            flex: 1; padding: 8px 0; background: none; border: none;
            color: var(--text-primary); font-size: 0.82rem; outline: none; font-family: inherit;
        }
        .time-range-pills { display: flex; gap: 4px; }
        .pill {
            padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border);
            background: none; color: var(--text-secondary); font-size: 0.75rem; cursor: pointer;
            font-family: inherit;
        }
        .pill.active { background: var(--accent); color: white; border-color: var(--accent); }
        .cat-filter-select, .sort-select {
            padding: 6px 10px; background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 8px; color: var(--text-primary); font-size: 0.78rem; outline: none;
            font-family: inherit;
        }
        .filter-summary { color: var(--text-secondary); font-size: 0.8rem; margin-bottom: 12px; }
        .stats-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }

        /* Date groups */
        .date-group { margin-bottom: 16px; }
        .date-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 8px; padding: 0 4px;
        }
        .date-label { font-weight: 600; font-size: 0.85rem; }
        .date-total { color: var(--text-secondary); font-size: 0.8rem; }

        /* Trend / top-category sublabel */
        .trend-sublabel { font-size: 0.7rem; color: var(--text-secondary); margin-top: 2px; }
        .top-cat-name { font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px; }

        /* Daily chart */
        .daily-chart { margin: 12px 0; }
        .daily-bars { display: flex; gap: 4px; align-items: flex-end; height: 160px; }
        .daily-bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .daily-bar-value { font-size: 0.55rem; color: var(--text-secondary); height: 14px; white-space: nowrap; }
        .daily-bar-track {
            width: 100%; height: 100px; background: rgba(255,255,255,0.04);
            border-radius: 6px; display: flex; align-items: flex-end; overflow: hidden;
        }
        .daily-bar-fill {
            width: 100%; border-radius: 6px 6px 0 0;
            transition: height 0.4s ease; min-height: 0;
        }
        .daily-bar-label {
            font-size: 0.6rem; color: var(--text-secondary);
            text-align: center; white-space: pre-line; line-height: 1.3;
        }
        .daily-bar-label.today { color: var(--accent); font-weight: 600; }

        /* Chart container */
        .chart-container { overflow-x: auto; margin: 8px 0; }
        .chart-section { margin-bottom: 24px; }
        .chart-section h3, .budget-section h3 { font-size: 0.95rem; margin-bottom: 10px; }

        /* Budget progress */
        .budget-section { margin-bottom: 24px; }
        .budget-item { margin-bottom: 12px; }
        .budget-header { display: flex; justify-content: space-between; font-size: 0.82rem; margin-bottom: 4px; }
        .budget-amount { color: var(--text-secondary); }
        .budget-amount.over { color: var(--danger); font-weight: 600; }
        .budget-bar-track {
            height: 8px; background: rgba(255,255,255,0.06); border-radius: 4px; overflow: hidden;
        }
        .budget-bar-fill {
            height: 100%; border-radius: 4px;
            transition: width 0.5s ease;
        }
        .budget-bar-fill.over { animation: pulse-red 1.5s infinite; }
        @keyframes pulse-red {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* Category manager */
        .category-form {
            background: var(--bg-card); border-radius: var(--radius); padding: 16px; margin-bottom: 16px;
        }
        .category-form h3 { margin-bottom: 12px; }
        .categories-list { margin-bottom: 20px; }
        .categories-list h3 { margin-bottom: 10px; }

        .category-item {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 0; border-bottom: 1px solid var(--border);
        }
        .category-item:last-child { border-bottom: none; }
        .cat-icon {
            width: 36px; height: 36px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center; font-size: 1.1rem;
        }
        .cat-info { flex: 1; }
        .cat-name { display: block; font-weight: 500; font-size: 0.9rem; }
        .cat-budget { display: block; font-size: 0.75rem; color: var(--text-secondary); }
        .cat-actions { display: flex; gap: 4px; }

        .icon-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
        .icon-btn {
            width: 38px; height: 38px; border-radius: 8px;
            background: var(--bg-primary); border: 1px solid var(--border);
            font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .icon-btn.selected { border-color: var(--accent); background: rgba(16, 185, 129, 0.15); }

        .currency-section { margin-bottom: 20px; }
        .currency-pills { display: flex; gap: 6px; flex-wrap: wrap; }

        .danger-zone {
            border-top: 1px solid var(--border); padding-top: 16px; margin-top: 8px;
        }
        .danger-zone h3 { font-size: 0.9rem; margin-bottom: 10px; color: var(--danger); }

        /* Empty states */
        .empty-state { text-align: center; padding: 40px 16px; }
        .empty-icon { font-size: 3rem; margin-bottom: 12px; }
        .empty-state p { color: var(--text-secondary); }
        .empty-hint { color: var(--text-secondary); font-size: 0.82rem; margin-top: 4px; }

        /* Responsive */
        @media (max-width: 480px) {
            .stat-cards { gap: 8px; }
            .stat-card { padding: 10px; }
            .fab { right: 20px; }
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <script type="module" src="/Main.fs.js"></script>
</body>
</html>
